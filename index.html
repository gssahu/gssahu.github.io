  /* Combined Theme Variables */
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --accent:#5b8cff; --accent2:#ff9f5b;

  html[data-theme="light"]{
    --bg:#f4f6fb; --panel:#ffffff; --panel2:#eef1f8; --accent:#3b5fe0; --accent2:#e07a2e;

  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Segoe UI', Roboto, -apple-system, sans-serif;
    background:radial-gradient(circle at 20% 0%, color-mix(in srgb, var(--accent) 8%, var(--bg)) 0%, var(--bg) 60%);
    color:var(--text); min-height:100vh; transition:background .2s, color .2s;
    background-attachment: fixed;
  }

  /* StudyHub UI Styles */
  header{
    padding:24px 24px 16px; text-align:center; border-bottom:1px solid var(--border);
    background:linear-gradient(180deg, rgba(91,140,255,.08), transparent);
    position:relative;
  }
  header h1{
    font-size:clamp(1.5rem,4vw,2.2rem); letter-spacing:.5px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  header p{color:var(--muted); margin-top:6px; font-size:.9rem;}
  .topbar{ max-width:1100px; margin:0 auto; display:flex; justify-content:flex-end; gap:10px; padding:10px 20px 0; }
  .iconbtn{
    background:var(--panel2); border:1px solid var(--border); color:var(--text);
    border-radius:999px; padding:8px 14px; cursor:pointer; font-size:.82rem;
    display:flex; align-items:center; gap:6px; transition:.15s;
  }
  .iconbtn:hover{border-color:var(--accent);}
  .iconbtn.active{background:var(--accent); color:#fff; border-color:var(--accent);}
  
  main{max-width:1100px; margin:0 auto; padding:20px 20px 60px;}
  .search{
    display:block; width:100%; max-width:420px; margin:0 auto 20px; padding:12px 16px;
    background:var(--panel2); border:1px solid var(--border); border-radius:999px;
    color:var(--text); font-size:.95rem; outline:none;
  }
  .search:focus{border-color:var(--accent);}
  .tabs{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-bottom:26px; }
  .tab{
    padding:7px 16px; border-radius:999px; border:1px solid var(--border); background:var(--panel2);
    color:var(--muted); font-size:.82rem; cursor:pointer; transition:.15s;
  }
  .tab:hover{border-color:var(--accent); color:var(--text);}
  .tab.active{background:var(--accent); color:#fff; border-color:var(--accent);}
  
  .grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:14px; }
  .card{
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    padding:20px 16px; text-align:center; cursor:pointer; transition:.18s ease; position:relative; overflow:hidden;
  }
  .card:hover{transform:translateY(-3px); border-color:var(--accent); box-shadow:0 10px 24px rgba(91,140,255,.15);}
  .card .big{font-size:1.6rem; font-weight:700; color:var(--accent);}
  .card .lbl{margin-top:6px; color:var(--muted); font-size:.85rem;}
  .card .progress-ring{ position:absolute; top:8px; right:8px; font-size:.7rem; color:var(--accent2); font-weight:700; }
  
  .section-title{ font-size:1.05rem; margin:8px 0 16px; color:var(--text); font-weight:600; display:flex; align-items:center; gap:8px; }
  .section-title .pill{ background:var(--accent); color:#fff; font-size:.7rem; padding:2px 10px; border-radius:999px; font-weight:700; }

  .linklist li a{

 #toolbar{

const BASE = "https://www.learninsta.com/";

// Scraped chapter-level index (class -> subject -> type -> resources)
// Update this URL if your GitHub username/repo/branch differs.
const SCRAPED_INDEX_URL = "https://raw.githubusercontent.com/gssahu/studyhub-content/main/index/cbse.json";
let SCRAPED = [];          // flat array of records once loaded
let scrapedLoaded = false;
let scrapedLoadError = null;

async function loadScrapedIndex(){
  try{
    const res = await fetch(SCRAPED_INDEX_URL, { cache: "no-store" });
    if(!res.ok) throw new Error("HTTP " + res.status);
    SCRAPED = await res.json();
    scrapedLoaded = true;
  }catch(e){
    console.error("Failed to load scraped index:", e);
    scrapedLoadError = e.message || "Unknown error";
  }
  render(); // re-render whatever view is currently showing once data arrives
}

// --- Helpers to query SCRAPED ---
function scrapedForClass(cls){
  return SCRAPED.filter(r => String(r.class) === String(cls));
}
function subjectsForClass(cls){
  const recs = scrapedForClass(cls);
  const map = {};
  recs.forEach(r=>{
    const name = r.subject || "General";
    if(!map[name]) map[name] = 0;
    map[name]++;
  });
  return Object.keys(map).sort().map(name => ({ name, count: map[name] }));
}
function typesForSubject(cls, subject){
  const recs = scrapedForClass(cls).filter(r => (r.subject || "General") === subject);
  const map = {};
  recs.forEach(r=>{
    if(!map[r.type]) map[r.type] = 0;
    map[r.type]++;
  });
  return Object.keys(map).sort().map(name => ({ name, count: map[name] }));
}
function resourcesForType(cls, subject, type){
  return scrapedForClass(cls)
    .filter(r => (r.subject || "General") === subject && r.type === type)
    .sort((a,b) => (a.chapter_num||0) - (b.chapter_num||0));
}
const TYPE_LABELS = {
  solution: "📘 Solutions", exemplar: "⭐ NCERT Exemplar", hots: "🧠 HOTS Questions",
  value_based_questions: "💡 Value Based Questions", previous_year_papers: "🗂️ Previous Year Papers",
  extra_questions: "➕ Extra Questions", mcq: "❓ MCQ", practical_questions: "🔬 Practical Questions",
  sample_paper: "📝 Sample Papers", worksheet: "🧾 Worksheets", notes: "🗒️ Notes", other: "🔗 Other Links"
};
function typeLabel(t){ return TYPE_LABELS[t] || ("🔗 " + t); }
const NCERT_OFFICIAL_URL = "https://raw.githubusercontent.com/gssahu/studyhub-content/main/index/ncert_official.json";
let OFFICIAL = {};          // { "10": { subjects: [...], books: { Subject: [{title,code,start,end}] } } }
let officialLoaded = false;
let officialLoadError = null;

async function loadOfficialIndex(){
  try{
    const res = await fetch(NCERT_OFFICIAL_URL, { cache: "no-store" });
    if(!res.ok) throw new Error("HTTP " + res.status);
    OFFICIAL = await res.json();
    officialLoaded = true;
  }catch(e){
    console.error("Failed to load NCERT official index:", e);
    officialLoadError = e.message || "Unknown error";
  }
  render();
}

// Generates chapter-wise PDF links for one book, entirely client-side -
// no network request needed, based on NCERT's own predictable filename
// pattern: {bookcode}{chapterNum, 2-digit padded}.pdf
function generateChapterLinks(book){
  const links = [];
  for(let n = book.start; n <= book.end; n++){
    const padded = String(n).padStart(2, "0");
    links.push({
      chapter_num: n,
      title: n === 0 ? "Front Matter / Preface" : `Chapter ${n}`,
      pdf_url: `https://ncert.nic.in/textbook/pdf/${book.code}${padded}.pdf`,
      book_page_url: `https://ncert.nic.in/textbook.php?${book.code}=${book.start}-${book.end}`
    });
  }
  return links;
}

function officialBooksForClass(cls){
  const entry = OFFICIAL[String(cls)];
  return entry ? entry : { subjects: [], books: {} };
}

function loadSet(key){ try{ return new Set(JSON.parse(localStorage.getItem(key)||"[]")); }catch(e){ return new Set(); } }
function saveSet(key, set){ localStorage.setItem(key, JSON.stringify([...set])); }

function allLinks(){
  let out = [];
  Object.keys(DATA).forEach(c=>{ DATA[c].subjects.forEach(s=> out.push({cls:c, ...s})); });
  EXTRA_RESOURCES.forEach(r=> out.push({cls:null, ...r}));
  CGBOARD_RESOURCES.forEach(r=> out.push({cls:null, ...r}));

function toggleFav(url, ev){

  updateStats(); render();
}

// MODIFIED: Injects link into the proxy reader instead of navigating away
function linkHTML(r, label){
  const absoluteUrl = r.url.startsWith('http') ? r.url : BASE + r.url;
  const isFav = favorites.has(r.url);
  const isVisited = visited.has(r.url);
  return `<li><a href="${absoluteUrl}" onclick="event.preventDefault(); openProxyFromHome('${absoluteUrl}', '${label}', '${r.url}')">
      <span class="left">${r.icon} ${label}${isVisited?'<span class="visited-badge">visited</span>':''}</span>
      <span style="display:flex; align-items:center; gap:10px;">
        <button class="starbtn ${isFav?'on':''}" onclick="toggleFav('${r.url}', event)">★</button>
        <span class="arrow">↗</span>
      </span>
    </a></li>`;
}

function filterByCategory(list){
  if(state.category === "all") return list;
  return list.filter(r => r.cat === state.category);
}

// Renders one scraped chapter/resource link using the same visual style
// as linkHTML(), but sourced from a scraped-index record instead of DATA.
function scrapedLinkHTML(r){
  const openUrl = r.pdf_url || r.source_url; // prefer the direct PDF if this source provides one
  const key = r.source_url; // keep favorites/visited keyed on the page URL so it stays stable even if pdf_url changes
  const isFav = favorites.has(key);
  const isVisited = visited.has(key);
  const chapterLabel = r.chapter_num ? `Ch ${r.chapter_num}: ` : "";
  const pdfBadge = r.pdf_url ? ' <span class="visited-badge" style="background:var(--accent); color:#fff;">PDF</span>' : "";
  const label = chapterLabel + r.title;
  const safeLabel = label.replace(/'/g, "\\'");
  return `<li><a href="${openUrl}" onclick="event.preventDefault(); openProxyFromHome('${openUrl}', '${safeLabel}', '${key}')">
      <span class="left">🔗 ${label}${pdfBadge}${isVisited?'<span class="visited-badge">visited</span>':''}</span>
      <span style="display:flex; align-items:center; gap:10px;">
        <button class="starbtn ${isFav?'on':''}" onclick="toggleFav('${key}', event)">★</button>
        <span class="arrow">↗</span>
      </span>
    </a></li>`;
}

function selectClass(c){ state.view="class"; state.cls=Number(c); state.subject=null; state.type=null; state.officialBookIndex=null; state.favOnly=false; document.getElementById("favBtn").classList.remove("active"); render(); }

document.getElementById("searchBox").addEventListener("input", (e)=>{
  const q = e.target.value.trim().toLowerCase();
  if(!q){ render(); return; }
  let results = allLinks().filter(r=> r.name.toLowerCase().includes(q) || (r.cls && ("class "+r.cls).includes(q)));
  results = filterByCategory(results);
  const content = document.getElementById("content");
  let html = `<div class="section-title">Search Results <span class="pill">${results.length}</span></div>`;
  if(results.length === 0) html += `<div class="empty">No matches found.</div>`;
  else {
    html += `<ul class="linklist">`;
    results.forEach(r=> html += linkHTML(r, r.cls ? `Class ${r.cls} — ${r.name}` : r.name));
    html += `</ul>`;
  }
  content.innerHTML = html;
});

const homeView = document.getElementById('home-view');
const readerView = document.getElementById('reader-view');
const container = document.getElementById('reader-container');
const loader = document.getElementById('loader');
const breadcrumbsDiv = document.getElementById('breadcrumbs');
const toolbarDiv = document.getElementById('toolbar');

function goHome(){ 
  // Switch UI back to StudyHub
  homeView.style.display = 'block';
  readerView.style.display = 'none';
  breadcrumbsDiv.style.display = 'none';
  
  // Reset StudyHub state
  state.view="home"; 
  state.cls=null; 
  state.subject=null;
  state.type=null;
  state.officialBookIndex=null;
  state.favOnly=false; 
  document.getElementById("favBtn").classList.remove("active"); 
  document.getElementById("searchBox").value=""; 
  
  pageHistory = [];
  render(); 
}

let preReaderState = null; // snapshot of state.view/cls/subject/type before opening the reader

function breadcrumbLabelFor(s){
  if(!s || s.view === "home") return "🏠 Home";
  if(s.view === "class") return `Class ${s.cls}`;
  if(s.view === "subject") return `${s.subject}`;
  if(s.view === "type") return `${typeLabel(s.type)}`;
  if(s.view === "osubject") return `${s.subject} (Official)`;
  if(s.view === "obook") return `Official Book`;
  return "🏠 Home";
}

function returnToApp(){
  readerView.style.display = 'none';
  homeView.style.display = 'block';
  breadcrumbsDiv.style.display = 'none';
  if(preReaderState){
    state.view = preReaderState.view;
    state.cls = preReaderState.cls;
    state.subject = preReaderState.subject;
    state.type = preReaderState.type;
    state.officialBookIndex = preReaderState.officialBookIndex;
  }
  pageHistory = [];
  render();
}

function openProxyFromHome(absoluteUrl, label, rawUrl) {
    markVisited(rawUrl);
    preReaderState = { view: state.view, cls: state.cls, subject: state.subject, type: state.type, officialBookIndex: state.officialBookIndex };
    pageHistory = [];
    // First breadcrumb returns to wherever the user actually came from
    // (Home grid, or Class > Subject > Type list) instead of always Home.
    pageHistory.push({ url: "__back__", title: breadcrumbLabelFor(preReaderState) });
    loadPage(absoluteUrl, -1, label);
}

async function loadPage(targetUrl, historyIndex = -1, clickedText = null) {
    // If user clicked the origin breadcrumb, return to their previous list view
    if (targetUrl === "__back__") {
        returnToApp();
        return;
    }
    // Legacy token, kept for safety if referenced elsewhere
    if (targetUrl === "home") {
        goHome();
        return;
    }

    // Switch UI to Proxy view
    homeView.style.display = 'none';
    readerView.style.display = 'block';
    
    container.innerHTML = '';
    loader.style.display = 'block';
    window.scrollTo(0, 0);

    try {
                // --- NEW: PDF AND GOOGLE DRIVE DETECTOR ---
                const isGoogleDrive = targetUrl.includes('drive.google.com/file/d/');
                const isPdf = targetUrl.toLowerCase().split('?')[0].endsWith('.pdf'); // Ignore URL parameters
                // Some government-hosted PDFs (e.g. .gov.in) can't be fetched by
                // Google's viewer at all - retrying never helps there. Render
                // these natively in the browser's own PDF engine instead.
                const isGovPdf = isPdf && /\.gov\.in\//i.test(targetUrl);

                if (isGovPdf) {
                    // These sites block iframe embedding entirely via their own
                    // security headers (X-Frame-Options / CSP) - this applies to
                    // ANY embedding attempt, not just Google's viewer, so there
                    // is no client-side workaround. Auto-open in a new tab instead.
                    loader.style.display = 'none';
                    toolbarDiv.style.display = 'flex';
                    container.innerHTML = `
                        <div style="text-align:center; padding:60px 20px;">
                            <div style="font-size:3rem; margin-bottom:16px;">🔒</div>
                            <div style="font-size:1.1rem; margin-bottom:8px;">This government site doesn't allow PDFs to be shown inside other apps.</div>
                            <div style="color:var(--muted); margin-bottom:24px;">It should have opened in a new tab automatically. If not, tap below.</div>
                            <a class="secondary" href="${targetUrl}" target="_blank" rel="noopener" style="text-decoration:none; display:inline-flex; align-items:center; padding:12px 24px; border-radius:8px; font-size:1rem;">
                                ↗ Open PDF in New Tab
                            </a>
                        </div>`;
                    // Auto-open once so the user doesn't have to click at all
                    window.open(targetUrl, '_blank', 'noopener');

                    let titleText = clickedText ? clickedText : "PDF Document";
                    if (historyIndex === -1) {
                        pageHistory.push({ url: targetUrl, title: titleText });
                    } else {
                        pageHistory = pageHistory.slice(0, historyIndex + 1);
                    }
                    renderBreadcrumbs();
                    return; // EXIT EARLY: skip the iframe-embedding logic below
                }

                // Vedantu's Revision Notes render as a JS-driven multi-page
                // image viewer where only page 1 exists in the static HTML -
                // the rest load only when the user clicks "next" on the live
                // site. Detect purely from the URL (reliable) rather than
                // scraped DOM classes (fragile, can vary by fetch/build).
                const isVedantuPaginatedViewer = /vedantu\.com/i.test(targetUrl) && /\/revision-notes\//i.test(targetUrl);

                if (isVedantuPaginatedViewer) {
                    loader.style.display = 'none';
                    toolbarDiv.style.display = 'flex';
                    container.innerHTML = `
                        <div style="text-align:center; padding:60px 20px;">
                            <div style="font-size:3rem; margin-bottom:16px;">📖</div>
                            <div style="font-size:1.1rem; margin-bottom:8px;">This page uses a multi-page viewer that only loads one page at a time here.</div>
                            <div style="color:var(--muted); margin-bottom:24px;">It should have opened in a new tab automatically. If not, tap below.</div>
                            <a class="secondary" href="${targetUrl}" target="_blank" rel="noopener" style="text-decoration:none; display:inline-flex; align-items:center; padding:12px 24px; border-radius:8px; font-size:1rem;">
                                ↗ Open Full Document in New Tab
                            </a>
                        </div>`;
                    window.open(targetUrl, '_blank', 'noopener');

                    let fallbackTitle = clickedText ? clickedText : "Document";
                    if (historyIndex === -1) {
                        pageHistory.push({ url: targetUrl, title: fallbackTitle });
                    } else {
                        pageHistory = pageHistory.slice(0, historyIndex + 1);
                    }
                    renderBreadcrumbs();
                    return; // EXIT EARLY: skip fetch/scraping entirely
                }

                if (isGoogleDrive || isPdf) {
                    loader.style.display = 'none';
                    toolbarDiv.style.display = 'flex';
                    
                    let iframeUrl = targetUrl;
                    
                    if (isGoogleDrive) {
                        // Google Drive requires '/preview' at the end of the URL to allow embedding
                        iframeUrl = targetUrl.replace(/\/view.*$/, '/preview');
                        if (!iframeUrl.endsWith('/preview')) {
                            // If it didn't have /view to replace, just append it safely
                            iframeUrl = iframeUrl.split('?')[0] + '/preview';
                        }
                    } else if (isPdf) {
                        // For generic raw .pdf links, force them through Google's free PDF viewer
			 iframeUrl = `https://docs.google.com/viewerng/viewer?url=${encodeURIComponent(targetUrl)}&embedded=true`;

                    }

                    // Render the PDF viewer inside our container, plus a retry
                    // button and an "open original" fallback - Google's viewer
                    // sometimes needs a second attempt for an uncached PDF, and
                    // some government-hosted PDFs are firewalled from Google's
                    // fetcher entirely, in which case retrying never helps and
                    // opening the source file directly is the only way through.
                    container.innerHTML = `
                        <iframe id="pdfFrame" src="${iframeUrl}" width="100%" height="800px" allowfullscreen="true" allow="fullscreen" webkitallowfullscreen="true" mozallowfullscreen="true" style="border: none; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);"></iframe>
                        <div style="text-align:center; margin-top:8px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
                            <button class="secondary" onclick="document.getElementById('pdfFrame').src = document.getElementById('pdfFrame').src">
                                🔄 PDF not showing? Tap to retry
                            </button>
                            <a class="secondary" href="${targetUrl}" target="_blank" rel="noopener" style="text-decoration:none; display:inline-flex; align-items:center; padding:8px 14px; border-radius:8px;">
                                ↗ Still blank? Open original PDF
                            </a>
                        </div>`;

                    // One automatic silent retry after 3.5s - covers the common
                    // case where the first load was blank because Google's
                    // viewer was still fetching/converting the source PDF.
                    setTimeout(() => {
                        const f = document.getElementById('pdfFrame');
                        if (f) f.src = f.src;
                    }, 3500);
                    
                    // Add the PDF to our history path
                    let titleText = clickedText ? clickedText : "PDF Document";
                    if (historyIndex === -1) {
                        pageHistory.push({ url: targetUrl, title: titleText });
                    } else {
                        pageHistory = pageHistory.slice(0, historyIndex + 1);
                    }
                    renderBreadcrumbs();
                    return; // EXIT EARLY: Do not run the rest of the web scraper!
                }
                // ------------------------------------------



        // Normal proxy fetch
        const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`;
        const response = await fetch(proxyUrl);
        if (!response.ok) throw new Error(`Proxy blocked. Status: ${response.status}`);
        
        const rawHtml = await response.text();
        const parser = new DOMParser();
        const doc = parser.parseFromString(rawHtml, 'text/html');

        const elementsToRemove = [
            'header', 'footer', 'nav', 'aside', 'iframe', 'script', 'style', 
            'link', '.sidebar', '.widget-area', '.comments-area', '#comments',
            '.ez-toc-container', '.adsbygoogle', '.ast-header-breadcrumb',
            'a[href^="tel:"]', 'a[href^="mailto:"]'
        ];
        elementsToRemove.forEach(selector => doc.querySelectorAll(selector).forEach(el => el.remove()));

        let mainContent = doc.querySelector('.entry-content') || doc.querySelector('article') || doc.body;

        // Some sites (e.g. Vedantu) leave nav-chrome elements like phone
        // numbers and dropdown arrow icons outside <nav>/<header>, so the
        // generic removal above misses them. Strip anything matching common
        // icon/UI-chrome filename patterns before they get treated as real
        // content images.
        const ICON_SRC_PATTERNS = /arrow|dropdown|toc-symbol|chevron|caret|hamburger|menu-icon|navbar/i;
        mainContent.querySelectorAll('img').forEach(img => {
            const src = img.getAttribute('src') || img.getAttribute('data-src') || '';
            if (ICON_SRC_PATTERNS.test(src)) img.remove();
        });
        // Catch any remaining tel:/mailto: links that were inside mainContent itself
        mainContent.querySelectorAll('a[href^="tel:"], a[href^="mailto:"]').forEach(el => el.remove());

        const links = mainContent.querySelectorAll('a');
        links.forEach(link => {
            let href = link.getAttribute('href');
            if (href) {
                if (href.startsWith('#') || href.startsWith('javascript:')) return; 
                const absoluteUrl = new URL(href, targetUrl).href;
                link.href = absoluteUrl; 
                link.onclick = (e) => {
                    if (absoluteUrl.startsWith('http')) {
                        e.preventDefault();
                        let linkText = link.textContent.trim();
                        if (!linkText) linkText = "Next Page"; 
                        loadPage(absoluteUrl, -1, linkText);
                    }
                };
            }
        });

        // --- NEW: LAZY LOAD IMAGE FIX ---
        const images = mainContent.querySelectorAll('img');
        images.forEach(img => {
            // 1. Look for hidden lazy-load URLs first, then fall back to standard 'src'
            let realSrc = img.getAttribute('data-src') || 
                          img.getAttribute('data-lazy-src') || 
                          img.getAttribute('data-opt-src') || 
                          img.getAttribute('src');
            
            if (realSrc) {
                // Ensure the URL is absolute
                img.src = new URL(realSrc, targetUrl).href;
            }
            
            // 2. Strip away the lazy-loading attributes so the browser doesn't get confused
            img.removeAttribute('srcset'); 
            img.removeAttribute('loading');
            img.removeAttribute('data-src');

            // 3. Cap size so icons/images that lose their site's CSS never
            // render at their raw native (sometimes huge) size.
            img.style.maxWidth = '100%';
            img.style.maxHeight = '400px';
            img.style.height = 'auto';
            img.style.width = 'auto';
            img.removeAttribute('data-lazy-src');
            img.removeAttribute('data-opt-src');
            
            // Optional: Add a subtle styling to images so they look nice in your reader
            img.style.display = 'block';
            img.style.margin = '20px auto';
            img.style.boxShadow = '0 4px 6px rgba(0,0,0,0.05)';
        });
        // --------------------------------

        let titleText = "Page";
        if (clickedText) {
            titleText = clickedText;
        } else {
            const pageTitleNode = doc.querySelector('.entry-title');
            if (pageTitleNode) titleText = pageTitleNode.textContent.trim();
        }

        if (historyIndex === -1) {
            pageHistory.push({ url: targetUrl, title: titleText });
        } else {
            pageHistory = pageHistory.slice(0, historyIndex + 1);
        }
        
        renderBreadcrumbs();

        loader.style.display = 'none';
        
        const pageTitleNode = doc.querySelector('.entry-title');
        if (pageTitleNode) container.appendChild(pageTitleNode);
        container.appendChild(mainContent);

        if (window.MathJax) {
            MathJax.typesetPromise([container]).catch(err => console.error('Math error:', err));
        }

    } catch (error) {
        console.error(error);
        loader.style.display = 'none';
        container.innerHTML = `<h2 style="color: #e74c3c;">Failed to load page</h2><p>${error.message}</p>`;
    }
}

function renderBreadcrumbs() {
    breadcrumbsDiv.innerHTML = '';
    
    if (pageHistory.length === 0) {
        breadcrumbsDiv.style.display = 'none';
        return;
    }

    breadcrumbsDiv.style.display = 'flex';

    pageHistory.forEach((page, index) => {
        const link = document.createElement('a');
        link.href = '#';
        link.textContent = page.title.length > 30 ? page.title.substring(0, 30) + '...' : page.title;
        
        link.onclick = (e) => {
            e.preventDefault();
            if (index === pageHistory.length - 1) return; 
            loadPage(page.url, index, page.title);
        };
        
        breadcrumbsDiv.appendChild(link);

        if (index < pageHistory.length - 1) {
            const separator = document.createElement('span');
            separator.className = 'separator';
            separator.textContent = '❯';
            breadcrumbsDiv.appendChild(separator);
        }
    });
}

// Initialize StudyHub on load
window.onload = function(){ render(); loadScrapedIndex(); loadOfficialIndex(); };

</script>
</body>
</html>
